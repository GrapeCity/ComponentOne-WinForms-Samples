definitions:
  steps:
    - step: &ai-review-step
        clone:
          depth: full
          lfs: false
        name: AI Code Review
        max-time: 40
        image: code.wynenterprise.io/docker/bitbucket-ai-review:c1
        runs-on: [kodo]
        script:
          - git config --global core.hooksPath /dev/null
          - rm -rf .git/hooks/*
          - |
            COMMIT_MSG=$(git log --format=%B -n 1 "$BITBUCKET_COMMIT")

            if [[ "$COMMIT_MSG" == *"[no ai]"* ]]; then
              echo "Skip pipeline: [no ai] found in commit message."
              exit 0
            fi

            export CC_BASE_URL=$C1_CC_BASE_URL
            export CC_API_KEY=$C1_CC_API_KEY
            export CC_MODEL=$C1_CC_MODEL
            export VCS_ACCESS_TOKEN=$BBATOKEN
            export ATLASSIAN_USER_EMAIL=$BBAEMAIL
            export TEAM_NAME="C1" 
            export GIT_LFS_SKIP_SMUDGE=1

            /pipe.sh

pipelines:
  pull-requests:
    "{feature/*,bugfix/*}":
      - step: *ai-review-step

  custom:
    ai-review:
      - step: *ai-review-step